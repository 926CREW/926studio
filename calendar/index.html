<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#111111">
<title>Lịch sử dụng 926 STUDIO</title>
<meta name="description" content="926 STUDIO – Đặt lịch thuê studio tại Hà Nội. Không gian luyện tập, lớp học, workshop.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ctext x='16' y='21' font-size='12' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3E926%3C/text%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff}
  iframe{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;border:0;display:block}
  #err{display:none;font:16px/1.6 system-ui,sans-serif;padding:40px;text-align:center;color:#333}
</style>
<script src="../config.js"></script>
</head>
<body>
<div id="err">Trang đang được cập nhật. Vui lòng thử lại sau.</div>
<script>
  (function(){
    var u = window.STUDIO_URL || '';
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)) { document.getElementById('err').style.display='block'; return; }
    var f = document.createElement('iframe');
    f.src = u + '?page=calendar';
    f.title = 'Lịch sử dụng 926 STUDIO';
    f.setAttribute('allow','clipboard-write');
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
